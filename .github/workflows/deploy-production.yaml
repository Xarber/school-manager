name: Deploy production

on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web and publish development update
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check TypeScript entries
        working-directory: ./app
        run: |
          echo "Top-level:"
          grep -n '"typescript": "~6.0.3"' package-lock.json

          echo
          echo "Nested TS 5.9.3:"
          grep -n 'typescript-5.9.3.tgz' package-lock.json || true

          echo
          echo "expo-module-scripts:"
          grep -n 'expo-module-scripts' package-lock.json | head -20

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export Expo App
        working-directory: ./app
        run: npx expo export

      - name: Deploy web to production
        working-directory: ./app
        run: eas deploy --prod --non-interactive

      - name: Publish development update
        working-directory: ./app
        run: |
          eas update \
            --channel development \
            --environment development \
            --message "GitHub commit ${{ github.sha }}" \
            --non-interactive
