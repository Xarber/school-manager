name: Deploy production

on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web and publish development update
    runs-on: ubuntu-latest

    permissions:
      contents: read

    #defaults:
    #  run:
    #    working-directory: app

    steps:
      - name: Show repository tree
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Debug package files
        run: |
          pwd
          node -v
          npm -v

          echo "=== package.json ==="
          cat package.json | grep typescript || true

          echo "=== package-lock.json ==="
          cat package-lock.json | grep typescript || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect checkout
        run: |
          pwd
          ls -la
          git status
          git rev-parse HEAD
          git branch -a
          git ls-tree --name-only HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json  # ✅ critical fix

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy web to production
        run: eas deploy --prod --non-interactive

      - name: Publish development update
        run: |
          eas update \
            --channel development \
            --environment development \
            --message "GitHub commit ${{ github.sha }}" \
            --non-interactive
