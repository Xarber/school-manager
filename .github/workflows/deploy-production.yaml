name: Deploy production

on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web and publish development update
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./app

    steps:

      - name: Inspect app package files
        working-directory: ./app
        run: |
          pwd
          echo "=== package.json ==="
          grep '"typescript"' package.json || true

          echo
          echo "=== package-lock.json ==="
          grep '"typescript"' package-lock.json | head -20 || true

          echo
          echo "=== npm ==="
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy web to production
        run: eas deploy --prod --non-interactive

      - name: Publish development update
        run: |
          eas update \
            --channel development \
            --environment development \
            --message "GitHub commit ${{ github.sha }}" \
            --non-interactive
