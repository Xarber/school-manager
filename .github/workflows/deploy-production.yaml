run-name: "Deploy ${{ github.ref_name }} • ${{ github.sha }}"

on:
  push:
    branches:
      - master
      - development
      - alpha
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure deployment
        id: config
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            master)
              echo "channel=release" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "prod=true" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "prod=false" >> "$GITHUB_OUTPUT"
              ;;
            alpha)
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "prod=false" >> "$GITHUB_OUTPUT"
              ;;
            development)
              echo "channel=development" >> "$GITHUB_OUTPUT"
              echo "environment=development" >> "$GITHUB_OUTPUT"
              echo "prod=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 0
              ;;
          esac

      - name: Export app
        working-directory: app
        run: npx expo export

      - name: Deploy web
        working-directory: app
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.prod }}" = "true" ]; then
            eas deploy --prod --non-interactive
          else
            eas deploy --non-interactive
          fi

      - name: Publish update
        working-directory: app
        run: |
          eas update \
            --channel "${{ steps.config.outputs.channel }}" \
            --environment "${{ steps.config.outputs.environment }}" \
            --message "${{ github.ref_name }} • ${{ github.sha }}" \
            --non-interactive