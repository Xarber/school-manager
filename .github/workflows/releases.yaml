run-name: "Build & Release ${{ github.ref_name }} • ${{ github.sha }}"

on:
  push:
    branches:
      - master
      - development
      - alpha
      - beta
  workflow_dispatch:

concurrency:
  group: releases-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate BuildInfo
        working-directory: app
        run: |
          node ./scripts/ci/build-context.js

      - name: Check for version change
        id: buildinfo
        shell: bash
        working-directory: app
        run: |
          VERSION_CHANGED=$(node -e "console.log(require('./constants/BuildInfo.json').versionChanged)")
          echo "versionChanged=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Skip native release
        if: steps.buildinfo.outputs.versionChanged != 'true'
        run: |
          echo "Version unchanged."
          echo "Skipping native release."

      - name: Start EAS builds
        if: steps.buildinfo.outputs.versionChanged == 'true'
        working-directory: app
        run: |
          node ./scripts/ci/start-builds.js

      - name: Wait & download builds
        if: steps.buildinfo.outputs.versionChanged == 'true'
        working-directory: app
        run: |
          node ./scripts/ci/download-builds.js

      - name: Rename artifacts
        if: steps.buildinfo.outputs.versionChanged == 'true'
        working-directory: app
        run: |
          node ./scripts/ci/rename-artifacts.js

      - name: Generate release notes
        if: steps.buildinfo.outputs.versionChanged == 'true'
        working-directory: app
        run: |
          node ./scripts/ci/generate-release-notes.js

      - name: Read release metadata
        if: steps.buildinfo.outputs.versionChanged == 'true'
        id: release
        shell: bash
        working-directory: app
        run: |

          TAG=$(node - <<'EOF'
          const info=require('./constants/BuildInfo.json');

          const branch=info.branch;

          if(branch==="development")
              console.log(`v${info.version}-dev`);
          else if(branch==="alpha")
              console.log(`v${info.version}-alpha`);
          else if(branch==="beta")
              console.log(`v${info.version}-beta`);
          else
              console.log(`v${info.version}`);
          EOF
          )

          TITLE=$(node - <<'EOF'
          const info=require('./constants/BuildInfo.json');

          const branch=info.branch;

          if(branch==="development")
              console.log(`School Manager v${info.version} (Development)`);
          else if(branch==="alpha")
              console.log(`School Manager v${info.version} Alpha`);
          else if(branch==="beta")
              console.log(`School Manager v${info.version} Beta`);
          else
              console.log(`School Manager v${info.version}`);
          EOF
          )

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create / Update GitHub Release
        if: steps.buildinfo.outputs.versionChanged == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: app/.ci/release-notes.md
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}
          files: |
            app/.ci/artifacts/**
            app/constants/BuildInfo.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}