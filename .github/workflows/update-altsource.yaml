name: Update AltSource

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  update-source:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update AltSource
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Empty for manual dispatch.
          # update_json.py will then find the latest
          # published non-prerelease release.
          RELEASE_TAG: ${{ github.event.release.tag_name }}

        run: |
          python .github/update_json.py

      - name: Update permanent AltSource release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.0"
          name: "AltSource"
          body: |
            This release contains the current School Manager AltSource.

            It is automatically updated whenever a new School Manager release is published.
          files: |
            .github/apps.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated source
        if: steps.update_source.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/apps.json

          git commit \
            -m "chore: update AltSource"

          git push

      - name: Summary
        run: |
          if [ "${{ steps.update_source.outputs.changes }}" = "true" ]; then
            echo "## AltSource Updated" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The School Manager AltSource was updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## AltSource Already Up To Date" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No changes were necessary." >> "$GITHUB_STEP_SUMMARY"
          fi