name: Update AltSource

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-source:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Determine release
        id: release
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EVENT_RELEASE_TAG" ]; then
            echo "tag=$EVENT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --abbrev=0)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine IPA filename
        id: ipa
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "filename=school-manager-${TAG}-ios.ipa" >> "$GITHUB_OUTPUT"

      - name: Update AltSource
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IPA_FILENAME: ${{ steps.ipa.outputs.filename }}
        run: |
          python .github/update_json.py

      - name: Update permanent AltSource release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.0"
          name: "AltSource"
          body: |
            This release contains the current School Manager AltSource.

            The source is automatically updated whenever a new School Manager release is published.
          files: |
            .github/apps.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated source
        if: steps.update_source.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/apps.json
          git commit -m "chore: update AltSource"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.update_source.outputs.changes }}" = "true" ]; then
            echo "## AltSource Updated" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Updated School Manager AltSource for \`${{ steps.release.outputs.tag }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## AltSource Already Up To Date" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No changes were necessary." >> "$GITHUB_STEP_SUMMARY"
          fi